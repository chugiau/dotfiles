---
- name: Verify
  hosts: all
  gather_facts: false

  tasks:
    - name: Check git is installed
      ansible.builtin.command:
        cmd: git --version
      changed_when: false

    - name: Check jq is installed
      ansible.builtin.command:
        cmd: jq --version
      changed_when: false

    - name: Check gpg is installed
      ansible.builtin.command:
        cmd: gpg --version
      changed_when: false

    - name: Check openssh-client is installed
      ansible.builtin.command:
        cmd: ssh -V
      changed_when: false

    - name: Check git-lfs is installed
      ansible.builtin.command:
        cmd: git-lfs version
      changed_when: false

    - name: Check XDG directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/testuser/.config
        - /home/testuser/.local/share
        - /home/testuser/.local/state
        - /home/testuser/.local/bin
        - /home/testuser/.cache
      register: xdg_dirs

    - name: Assert XDG directories exist
      ansible.builtin.assert:
        that: item.stat.exists and item.stat.isdir
        fail_msg: "XDG directory {{ item.item }} does not exist"
      loop: "{{ xdg_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check symlink was created
      ansible.builtin.stat:
        path: /home/testuser/.gitconfig
      register: gitconfig_link

    - name: Assert symlink exists and points correctly
      ansible.builtin.assert:
        that:
          - gitconfig_link.stat.exists
          - gitconfig_link.stat.islnk
        fail_msg: "~/.gitconfig symlink not created"
