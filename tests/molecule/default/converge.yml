---
- name: Converge
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - sudo
          - curl
          - git
        state: present
        update_cache: true

    - name: Create test user
      ansible.builtin.user:
        name: testuser
        shell: /bin/bash
        create_home: true

    - name: Setup fake dotfiles directory
      ansible.builtin.file:
        path: /home/testuser/.dotfiles
        state: directory
        owner: testuser
        mode: "0755"

    - name: Initialize git repo in dotfiles dir
      ansible.builtin.command:
        cmd: git init
        chdir: /home/testuser/.dotfiles
        creates: /home/testuser/.dotfiles/.git

    - name: Create test symlink file
      ansible.builtin.copy:
        content: "# test gitconfig"
        dest: /home/testuser/.dotfiles/gitconfig.symlink
        owner: testuser
        mode: "0644"

    - name: Create secrets directory
      ansible.builtin.file:
        path: /home/testuser/.dotfiles/secrets
        state: directory
        owner: testuser
        mode: "0755"

    - name: Create secrets template
      ansible.builtin.copy:
        content: "# example"
        dest: /home/testuser/.dotfiles/secrets/test.env.example
        owner: testuser
        mode: "0644"

    - name: Create git hooks directory
      ansible.builtin.file:
        path: /home/testuser/.dotfiles/git/hooks
        state: directory
        owner: testuser
        mode: "0755"

    - name: Create .git/hooks directory
      ansible.builtin.file:
        path: /home/testuser/.dotfiles/.git/hooks
        state: directory
        owner: testuser
        mode: "0755"

    - name: Detect WSL
      ansible.builtin.set_fact:
        is_wsl: false

    - name: Set brew facts
      ansible.builtin.set_fact:
        brew_prefix: /home/linuxbrew/.linuxbrew
        brew_available: false

    - name: Create XDG directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /home/testuser/.config
        - /home/testuser/.local/share
        - /home/testuser/.local/state
        - /home/testuser/.local/bin
        - /home/testuser/.cache

  tasks:
    - name: Run core role
      ansible.builtin.include_role:
        name: core

    - name: Run dotfiles role
      ansible.builtin.include_role:
        name: dotfiles
      vars:
        ansible_facts:
          env:
            HOME: /home/testuser
