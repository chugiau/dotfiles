# mise tool manifest
#
# Defines the CLI toolchain managed by mise.  `dotfiles install` runs
# `mise install` which materialises every tool listed here under
# ~/.local/share/mise/installs, then shims them into ~/.local/share/mise/shims
# (already on PATH via the login shell).
#
# To add a tool: append it here and re-run `dotfiles install`.
# To pin a version: replace "latest" with an explicit version string.

[tools]
bat     = "latest"
"aqua:eza-community/eza" = "latest"
lazygit = "latest"
glow    = "latest"
ripgrep = "latest"
node    = "lts"
bun     = "latest"
gh      = "latest"
glab    = "latest"
codex   = "latest"
gcloud  = "latest"
direnv  = "latest"
bats    = "latest"
shellcheck = "latest"
shfmt      = "latest"
