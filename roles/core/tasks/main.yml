---
# Core system packages: always installed via system package manager.
# These integrate deeply with the OS (PAM, systemd, /etc/shells).

- name: "core | Check for distro tasks: {{ ansible_os_family }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_os_family }}.yml"
  register: core_distro_config

- name: "core | Run distro tasks: {{ ansible_os_family }}"
  ansible.builtin.include_tasks: "{{ ansible_os_family }}.yml"
  when: core_distro_config.stat.exists

- name: "core | Initialize Git LFS"
  ansible.builtin.command:
    cmd: git lfs install --skip-repo
  register: git_lfs_init
  changed_when: "'Updated' in git_lfs_init.stdout"

- name: "core | Verify core tools are available"
  ansible.builtin.command:
    cmd: "{{ item }} --version"
  loop:
    - git
    - jq
    - gpg
  changed_when: false
