---
# On macOS, Xcode Command Line Tools are the only prerequisite.
# The Homebrew installer handles this automatically.
- name: "homebrew | Darwin | Check Xcode CLI tools"
  ansible.builtin.command:
    cmd: xcode-select -p
  register: xcode_check
  changed_when: false
  failed_when: false

- name: "homebrew | Darwin | Note about Xcode CLI tools"
  ansible.builtin.debug:
    msg: "Xcode CLI tools not found — Homebrew installer will prompt for them."
  when: xcode_check.rc != 0
