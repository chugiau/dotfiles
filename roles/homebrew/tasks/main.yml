---
- name: "homebrew | Check for distro tasks: {{ ansible_os_family }}"
  ansible.builtin.stat:
    path: "{{ role_path }}/tasks/{{ ansible_os_family }}.yml"
  register: homebrew_distro_config

- name: "homebrew | Run distro tasks: {{ ansible_os_family }}"
  ansible.builtin.include_tasks: "{{ ansible_os_family }}.yml"
  when: homebrew_distro_config.stat.exists

- name: "homebrew | Check if Homebrew is installed"
  ansible.builtin.stat:
    path: "{{ brew_prefix }}/bin/brew"
  register: homebrew_check

- name: "homebrew | Install Homebrew"
  ansible.builtin.shell:
    cmd: >
      NONINTERACTIVE=1
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not homebrew_check.stat.exists
  changed_when: true

- name: "homebrew | Verify Homebrew is available"
  ansible.builtin.command:
    cmd: "{{ brew_prefix }}/bin/brew --version"
  register: brew_version
  changed_when: false

- name: "homebrew | Display Homebrew version"
  ansible.builtin.debug:
    msg: "{{ brew_version.stdout_lines[0] }}"

- name: "homebrew | Update Homebrew"
  ansible.builtin.command:
    cmd: "{{ brew_prefix }}/bin/brew update"
  changed_when: false
  tags: [update]
