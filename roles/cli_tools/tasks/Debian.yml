---
# bat: available as 'bat' in Ubuntu 23.04+ / Debian 12+.
# On older releases the binary is named 'batcat'.
- name: "cli_tools | Debian | Install bat"
  ansible.builtin.apt:
    name: bat
    state: present
  become: true

# eza: requires adding the official GPG key and repository
- name: "cli_tools | Debian | Add eza GPG key"
  ansible.builtin.shell:
    cmd: >
      mkdir -p /etc/apt/keyrings &&
      wget -qO- https://raw.githubusercontent.com/eza-community/eza/main/deb.asc
      | gpg --dearmor -o /etc/apt/keyrings/gierens.gpg
    creates: /etc/apt/keyrings/gierens.gpg
  become: true

- name: "cli_tools | Debian | Add eza repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.gpg] http://deb.gierens.de stable main"
    state: present
    filename: gierens
  become: true

- name: "cli_tools | Debian | Install eza"
  ansible.builtin.apt:
    name: eza
    state: present
    update_cache: true
  become: true

# glow: available via Charm's official apt repository
- name: "cli_tools | Debian | Add Charm GPG key"
  ansible.builtin.shell:
    cmd: >
      mkdir -p /etc/apt/keyrings &&
      curl -fsSL https://repo.charm.sh/apt/gpg.key
      | gpg --dearmor -o /etc/apt/keyrings/charm.gpg
    creates: /etc/apt/keyrings/charm.gpg
  become: true

- name: "cli_tools | Debian | Add Charm repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *"
    state: present
    filename: charm
  become: true

- name: "cli_tools | Debian | Install glow"
  ansible.builtin.apt:
    name: glow
    state: present
    update_cache: true
  become: true

# lazygit: download latest binary from GitHub releases
- name: "cli_tools | Debian | Get latest lazygit version"
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
    return_content: true
  register: lazygit_release

- name: "cli_tools | Debian | Set lazygit version fact"
  ansible.builtin.set_fact:
    lazygit_version: "{{ lazygit_release.json.tag_name | regex_replace('^v', '') }}"

- name: "cli_tools | Debian | Download lazygit"
  ansible.builtin.unarchive:
    src: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_Linux_x86_64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include:
      - lazygit
    mode: "0755"
  become: true
