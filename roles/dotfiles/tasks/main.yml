---
# --- Symlinks: *.symlink → ~/.basename ---

- name: "dotfiles | Find all *.symlink files"
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}"
    patterns: "*.symlink"
    recurse: true
    file_type: any
  register: symlink_files

- name: "dotfiles | Create dotfile symlinks"
  ansible.builtin.file:
    src: "{{ symlink_entry.path }}"
    dest: "{{ ansible_facts.env.HOME }}/.{{ symlink_entry.path | basename | regex_replace('\\.symlink$', '') }}"
    state: link
    force: true
  loop: "{{ symlink_files.files }}"
  loop_control:
    loop_var: symlink_entry
    label: "{{ symlink_entry.path | basename }} → ~/.{{ symlink_entry.path | basename | regex_replace('\\.symlink$', '') }}"

# --- Claude Code config ---

- name: "dotfiles | Ensure ~/.claude directory exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.claude"
    state: directory
    mode: "0755"

- name: "dotfiles | Find claude config files"
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}/claude"
    file_type: file
  register: claude_files

- name: "dotfiles | Link claude configs"
  ansible.builtin.file:
    src: "{{ claude_entry.path }}"
    dest: "{{ ansible_facts.env.HOME }}/.claude/{{ claude_entry.path | basename }}"
    state: link
    force: true
  loop: "{{ claude_files.files }}"
  loop_control:
    loop_var: claude_entry
    label: "{{ claude_entry.path | basename }}"

# --- Git hooks ---

- name: "dotfiles | Ensure .git/hooks directory exists"
  ansible.builtin.file:
    path: "{{ dotfiles_dir }}/.git/hooks"
    state: directory
    mode: "0755"

- name: "dotfiles | Find git hook files"
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}/git/hooks"
    file_type: file
  register: hook_files

- name: "dotfiles | Install git hooks"
  ansible.builtin.file:
    src: "{{ hook_entry.path }}"
    dest: "{{ dotfiles_dir }}/.git/hooks/{{ hook_entry.path | basename }}"
    state: link
    force: true
  loop: "{{ hook_files.files }}"
  loop_control:
    loop_var: hook_entry
    label: "{{ hook_entry.path | basename }}"

# --- Secrets from templates ---

- name: "dotfiles | Find secrets templates"
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}/secrets"
    patterns: "*.env.example"
  register: secret_templates

- name: "dotfiles | Create secrets from templates (won't overwrite existing)"
  ansible.builtin.copy:
    src: "{{ secret_entry.path }}"
    dest: "{{ secret_entry.path | regex_replace('\\.example$', '') }}"
    mode: "0600"
    force: false
  loop: "{{ secret_templates.files }}"
  loop_control:
    loop_var: secret_entry
    label: "{{ secret_entry.path | basename | regex_replace('\\.example$', '') }}"

# --- Alias fixups (batcat→bat, fdfind→fd, etc.) ---

- name: "dotfiles | Ensure ~/.local/bin exists"
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: "dotfiles | Check alias fixup sources"
  ansible.builtin.stat:
    path: "{{ alias_entry.check }}"
  loop: "{{ dotfiles_alias_fixups }}"
  loop_control:
    loop_var: alias_entry
    label: "{{ alias_entry.check }}"
  register: alias_checks

- name: "dotfiles | Check alias fixup targets already exist"
  ansible.builtin.command:
    cmd: "which {{ alias_check.alias_entry.link | basename }}"
  loop: "{{ alias_checks.results }}"
  loop_control:
    loop_var: alias_check
    label: "{{ alias_check.alias_entry.link | basename }}"
  register: alias_existing
  changed_when: false
  failed_when: false

- name: "dotfiles | Create alias symlinks where needed"
  ansible.builtin.file:
    src: "{{ alias_pair.0.alias_entry.check }}"
    dest: "{{ alias_pair.0.alias_entry.link }}"
    state: link
  loop: "{{ alias_checks.results | zip(alias_existing.results) | list }}"
  loop_control:
    loop_var: alias_pair
    label: "{{ alias_pair.0.alias_entry.link | basename }}"
  when:
    - alias_pair.0.stat.exists
    - alias_pair.1.rc != 0
