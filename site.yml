---
- name: Dotfiles Setup
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Detect WSL
      ansible.builtin.import_tasks: pre_tasks/detect_wsl.yml
      tags: [always]

    - name: Detect Homebrew
      ansible.builtin.import_tasks: pre_tasks/detect_brew.yml
      tags: [always]

    - name: Setup XDG directories
      ansible.builtin.import_tasks: pre_tasks/setup_xdg.yml
      tags: [always]

  tasks:
    - name: Compute active roles
      ansible.builtin.set_fact:
        active_roles: >-
          {{ default_roles | reject('in', exclude_roles | default([])) | list }}
      tags: [always]

    - name: Display active roles
      ansible.builtin.debug:
        msg: "Roles to run: {{ active_roles | join(', ') }}"
      tags: [always]

    - name: Run roles
      ansible.builtin.include_role:
        name: "{{ item }}"
        apply:
          tags: ["{{ item }}"]
      loop: "{{ active_roles }}"
      loop_control:
        label: "{{ item }}"
      tags: [always]
